name: Release

# extension/manifest.json의 version을 올려 main에 푸시하면, 그 버전의 GitHub 릴리스(태그 포함)를 만듭니다.
# 이미 같은 버전의 릴리스가 있으면 아무것도 하지 않아요. Actions 탭에서 직접 실행할 수도 있어요.
on:
  push:
    branches: [main]
    paths: ['extension/manifest.json']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 버전 확인
        id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./extension/manifest.json').version")
          TAG="v$VERSION"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "$TAG 릴리스가 이미 있어서 건너뜁니다."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
          node tools/build-rules.mjs --check

      # replx-vX.Y.Z.zip(버전 표시)과 replx.zip(항상 같은 이름) 두 개를 올립니다.
      # replx.zip은 https://github.com/ksthink/replx/releases/latest/download/replx.zip 으로 늘 최신 버전을 받게 해 줘요.
      - name: 압축 및 릴리스
        if: steps.v.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.v.outputs.tag }}
        run: |
          cd extension && zip -qr "../replx-$TAG.zip" . && cd ..
          cp "replx-$TAG.zip" replx.zip
          cat > notes.md <<'NOTES'
          ## 설치
          1. 아래 **replx.zip**을 받아 압축을 풉니다.
          2. Chrome 주소창에 `chrome://extensions`를 입력하고 오른쪽 위의 **개발자 모드**를 켭니다.
          3. **압축해제된 확장 프로그램을 로드합니다**를 누르고 압축을 푼 폴더를 고릅니다.
          4. 퍼즐 아이콘에서 Replx를 툴바에 고정하고, 열려 있던 탭은 새로고침합니다.

          업데이트할 때는 새 zip으로 폴더를 덮어쓴 뒤 `chrome://extensions`에서 Replx의 새로고침(⟳)을 누르세요. 규칙과 설정은 그대로 남아요.
          NOTES
          gh release create "$TAG" "replx-$TAG.zip" replx.zip --target "$GITHUB_SHA" \
            --title "Replx $TAG" --notes-file notes.md --generate-notes --latest

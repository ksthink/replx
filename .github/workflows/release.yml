name: Release

# v0.1.0 같은 태그를 푸시하면 확장 zip을 만들어 GitHub 릴리스에 올립니다.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 태그와 manifest 버전 일치 확인
        run: |
          VERSION=$(node -p "require('./extension/manifest.json').version")
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "태그($GITHUB_REF_NAME)와 manifest 버전(v$VERSION)이 다릅니다."; exit 1
          fi
          node tools/build-rules.mjs --check

      # replx-vX.Y.Z.zip(버전 표시)과 replx.zip(항상 같은 이름) 두 개를 올립니다.
      # replx.zip은 https://github.com/ksthink/replx/releases/latest/download/replx.zip 으로 늘 최신 버전을 받게 해 줘요.
      - name: 압축 및 릴리스
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd extension && zip -qr "../replx-$GITHUB_REF_NAME.zip" . && cd ..
          cp "replx-$GITHUB_REF_NAME.zip" replx.zip
          cat > notes.md <<'NOTES'
          ## 설치
          1. 아래 **replx.zip**을 받아 압축을 풉니다.
          2. Chrome 주소창에 `chrome://extensions`를 입력하고 오른쪽 위의 **개발자 모드**를 켭니다.
          3. **압축해제된 확장 프로그램을 로드합니다**를 누르고 압축을 푼 폴더를 고릅니다.
          4. 퍼즐 아이콘에서 Replx를 툴바에 고정하고, 열려 있던 탭은 새로고침합니다.

          업데이트할 때는 새 zip으로 폴더를 덮어쓴 뒤 `chrome://extensions`에서 Replx의 새로고침(⟳)을 누르세요. 규칙과 설정은 그대로 남아요.
          NOTES
          gh release create "$GITHUB_REF_NAME" "replx-$GITHUB_REF_NAME.zip" replx.zip \
            --title "Replx $GITHUB_REF_NAME" --notes-file notes.md --generate-notes --latest

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 규칙 파일 최신 여부 확인
        run: node tools/build-rules.mjs --check

      - name: 문법·매니페스트 검사
        run: |
          for f in $(find extension -name '*.js'); do node --check "$f"; done
          node -e "JSON.parse(require('fs').readFileSync('extension/manifest.json','utf8'))"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Playwright·한글 폰트 설치
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk

      - name: E2E 테스트 (확장을 크롬에 올려 검증)
        run: python tests/e2e.py

      - name: 버전 읽기
        run: echo "VERSION=$(node -p "require('./extension/manifest.json').version")" >> "$GITHUB_ENV"

      # 아티팩트를 받아 압축을 풀면 바로 크롬에 불러올 수 있는 폴더가 나옵니다.
      - uses: actions/upload-artifact@v4
        with:
          name: replx-${{ env.VERSION }}
          path: extension/

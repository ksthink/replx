<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>Replx 설정</title>
  <style>
    body { max-width: 760px; margin: 32px auto; padding: 0 20px; font: 14px/1.6 -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; color: #222; }
    h1 { font-size: 22px; display: flex; align-items: center; gap: 10px; }
    h1 img { width: 32px; }
    h2 { font-size: 16px; margin: 28px 0 6px; }
    p.d { color: #777; margin: 0 0 8px; font-size: 13px; }
    textarea { width: 100%; min-height: 150px; font: 12.5px/1.5 ui-monospace, Menlo, Consolas, monospace; padding: 10px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; }
    .bar { display: flex; gap: 8px; margin-top: 10px; align-items: center; flex-wrap: wrap; }
    button { border: 1px solid #ddd; background: #fafafa; border-radius: 7px; padding: 7px 12px; font: inherit; cursor: pointer; }
    button.primary { background: #e03a26; border-color: #e03a26; color: #fff; }
    #msg { color: #389e0d; font-size: 13px; }
    #msg.err { color: #cf1322; }
    code { background: #f5f5f5; padding: 1px 5px; border-radius: 4px; }
  </style>
</head>
<body>
  <h1><img src="../icons/48.png" alt=""> Replx 설정</h1>

  <h2>숨김 규칙</h2>
  <p class="d">한 줄에 하나씩 <code>사이트 | CSS 선택자</code> 형식이에요. 예: <code>theqoo.net | #comment</code></p>
  <textarea id="userRules" spellcheck="false"></textarea>

  <h2>제외 규칙 (숨기지 않을 영역)</h2>
  <p class="d">여기 적은 영역과 그 안팎은 어떤 규칙이나 자동 탐지에 걸려도 숨기지 않아요. 같은 형식으로 적어요.</p>
  <textarea id="userAllow" spellcheck="false" style="min-height:90px"></textarea>

  <h2>제외 사이트</h2>
  <p class="d">이 사이트들(하위 도메인 포함)에서는 아무것도 숨기지 않아요. 한 줄에 하나씩.</p>
  <textarea id="excludedSites" spellcheck="false" style="min-height:110px"></textarea>

  <h2>꺼 둔 사이트</h2>
  <p class="d">팝업에서 "이 사이트에서 사용"을 끈 사이트예요.</p>
  <textarea id="disabledSites" spellcheck="false" style="min-height:80px"></textarea>

  <div class="bar">
    <button class="primary" id="save">저장</button>
    <button id="export">내보내기(JSON)</button>
    <button id="import">가져오기</button>
    <input type="file" id="file" accept="application/json" hidden>
    <span id="msg"></span>
  </div>

  <script src="../src/defaults.js"></script>
  <script src="options.js"></script>
</body>
</html>

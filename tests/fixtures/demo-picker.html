<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>데모 블로그 - 자동 탐지가 놓치는 구조</title>
<style>
  body { margin: 0; background: #fbfaf7; font: 15px/1.7 -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif; color: #2a2a2a; }
  .k1 { max-width: 720px; margin: 28px auto; padding: 0 22px; }
  h1 { font-size: 24px; margin: 0 0 4px; } .k2 { color: #999; font-size: 13px; }
  .k3 p { margin: 14px 0; }
  .zz { margin-top: 26px; border-top: 2px solid #eee; padding-top: 14px; }
  .yy p { margin: 8px 0; padding: 10px 14px; background: #f2efe8; border-radius: 10px; }
  .yy b { margin-right: 6px; }
  .other { margin-top: 26px; padding: 14px; border: 1px solid #e6e2d8; border-radius: 10px; color: #666; font-size: 13.5px; }
</style>
</head>
<body>
  <div class="k1">
    <h1>겨울 책장 정리 기록</h1>
    <div class="k2">2026년 11월 20일 · 책 이야기</div>
    <div class="k3">
      <p>올해 읽은 책들을 다시 꽂으면서 장르별로 칸을 나눴다. 시집은 창가 쪽, 두꺼운 소설은 아래 칸으로 내렸다.</p>
      <p>정리하다 보니 끝까지 못 읽은 책이 꽤 많다. 겨울 동안 한 권씩 다시 펼쳐 볼 생각이다.</p>
    </div>
    <div class="zz">
      <div class="yy">
        <p><b>책벌레</b>저도 올해 못 읽은 책이 산더미예요</p>
        <p><b>새벽세시</b>시집 창가 배치 좋네요</p>
        <p><b>지나가는사람</b>사진도 올려주세요</p>
      </div>
    </div>
    <div class="other">이 블로그의 다른 글: 가을 독서 목록 · 동네 도서관 탐방기</div>
  </div>
</body>
</html>
